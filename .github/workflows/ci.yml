name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (GTK4, libadwaita, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-venv xvfb
      - name: Virtualenv with dev tools
        run: |
          python3 -m venv .venv --system-site-packages
          .venv/bin/pip install -e . mypy pytest ruff
      - name: Lint
        run: |
          .venv/bin/ruff check chatbridge tests scripts
          .venv/bin/ruff format --check chatbridge tests scripts
      - name: Types (mypy --strict)
        run: .venv/bin/mypy
      - name: Unit + CLI end-to-end tests
        run: .venv/bin/pytest -W ignore --deselect tests/test_gui_e2e.py
      - name: GUI end-to-end tests (virtual display)
        run: xvfb-run -a .venv/bin/pytest -W ignore tests/test_gui_e2e.py
      - name: Package builds and contains the Cursor templates
        run: |
          .venv/bin/pip wheel . --no-deps -w dist -q
          python3 -m zipfile -l dist/*.whl | grep -q "chatbridge/data/cursor_templates.json"

  deb:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the .deb
        run: packaging/deb/build-deb.sh dist
      - name: Validate package metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream xvfb
          dpkg-deb --info dist/*.deb
          dpkg -x dist/*.deb /tmp/payload
          desktop-file-validate /tmp/payload/usr/share/applications/*.desktop
          appstreamcli validate --no-net /tmp/payload/usr/share/metainfo/*.xml
      - name: Install on a clean Ubuntu 24.04 (apt resolves dependencies)
        run: sudo apt-get install -y ./dist/chatbridge_*_all.deb
      - name: Smoke test the installed package
        run: |
          chatbridge --help >/dev/null
          chatbridge doctor
          xvfb-run -a timeout 12 chatbridge-gui >/tmp/gui.log 2>&1 || test $? -eq 124
          ! grep -i -E "traceback|critical" /tmp/gui.log
      - name: Uninstall leaves nothing behind
        run: |
          sudo apt-get remove -y chatbridge
          test ! -e /usr/bin/chatbridge && test ! -d /usr/lib/python3/dist-packages/chatbridge
      - uses: actions/upload-artifact@v4
        with:
          name: chatbridge-deb
          path: dist/*.deb

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with dev tools
        run: python -m pip install -e . mypy pytest ruff
      - name: Lint
        run: |
          python -m ruff check chatbridge tests scripts
          python -m ruff format --check chatbridge tests scripts
      - name: Types (mypy --strict)
        run: python -m mypy
      - name: Unit, CLI and Tk GUI end-to-end tests
        run: python -m pytest -W ignore
      - name: Install with install.ps1, smoke test, uninstall
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'cb'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Prefix "$t\app" -StartMenuDir "$t\sm" -NoPath
          & "$t\app\bin\chatbridge.cmd" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'chatbridge --help failed' }
          & "$t\app\bin\chatbridge.cmd" doctor
          if (-not (Test-Path "$t\sm\ChatBridge.lnk")) { throw 'no Start Menu shortcut' }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Prefix "$t\app" -StartMenuDir "$t\sm" -NoPath -Uninstall
          if (Test-Path "$t\app") { throw 'uninstall left files behind' }
