[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbridge"
dynamic = ["version"]
description = "Import Cursor chat history into the Claude desktop app, losslessly (Ubuntu / GTK4)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = ["cursor", "claude", "chat-history", "sync", "gtk4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pwnapplehat/chatbridge"
Issues = "https://github.com/pwnapplehat/chatbridge/issues"

[project.scripts]
chatbridge = "chatbridge.cli:main_entry"
chatbridge-gui = "chatbridge.gui.app:main_entry"

[tool.setuptools.dynamic]
version = { attr = "chatbridge.__version__" }

[tool.setuptools.packages.find]
include = ["chatbridge*"]

[tool.setuptools.package-data]
chatbridge = ["py.typed", "data/*.json"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP037", "RUF012", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["chatbridge", "tests"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gui: needs a display (run under xvfb-run)"]

[[tool.mypy.overrides]]
module = "chatbridge.gui.*"
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_return_any = false
